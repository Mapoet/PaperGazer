# 存储配置
store:
  root: "./data/test"
  db_path: "./data/test/test.db"
  papers_dir: "./data/test/papers"

# 调度配置
schedule:
  enabled: false
  timezone: "UTC"
  hour: 0
  minute: 0

# 日志配置
logging:
  level: "INFO"
  format: "text"
  file: "./data/test/test.log"

# 重试配置
retry:
  max_attempts: 3
  initial_delay: 1.0
  max_delay: 60.0
  exponential_base: 2.0

