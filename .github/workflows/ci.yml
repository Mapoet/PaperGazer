name: CI

on:
  push:
    branches: [dev, dev-codex, main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,analytics]"
      - name: Verify distribution metadata
        run: python -m build --wheel
      - name: Lint
        run: ruff check papergazer scripts tests
      - name: Type check
        run: mypy papergazer
      - name: Test offline suite
        run: pytest -m "not network" -q
